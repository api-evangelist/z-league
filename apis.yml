aid: z-league
name: Z League
description: >-
  Z League is an a16z-backed startup that operates the MEGA platform (gomega.ai)
  — a suite of AI marketing agents that autonomously manage SEO, paid advertising,
  and website/growth optimization for businesses at a fraction of traditional
  agency cost. MEGA also ships a built-in CRM, and exposes the MEGA public CRM Lead
  API: a server-to-server REST API to pull/search leads with cursor pagination,
  push leads one-at-a-time or in bulk (up to 500) with idempotency and email/phone
  de-duplication, and register HMAC-signed `lead.created` webhooks. Authentication
  is an admin-issued, customer-locked, scoped Personal Access Token (Bearer
  `mega_...`) plus an `x-customer-id` header. The API is documented with an
  OpenAPI 3.1 spec and a Mintlify developer portal published from the company's
  public GitHub org (github.com/zleague).
